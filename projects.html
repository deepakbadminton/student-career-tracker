<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Projects</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 15px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 11px 16px;
            border-radius: 7px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .project {
            border: 1px solid #e5e7eb;
            padding: 18px;
            margin-top: 15px;
            border-radius: 10px;
        }

        .project h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .status {
            font-weight: bold;
        }

        .delete-button {
            background: #dc2626;
            margin-top: 10px;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .back-button {
            display: inline-block;
            margin-bottom: 10px;
            color: #2563eb;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <a href="dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>


    <h1>🚀 My Projects</h1>


    <!-- Add Project -->

    <div class="card">

        <h2>Add New Project</h2>

        <label>
            Project Name
        </label>

        <input
            type="text"
            id="projectName"
            placeholder="Example: Student Career Tracker"
        >


        <label>
            Description
        </label>

        <textarea
            id="projectDescription"
            placeholder="Describe what your project does"
        ></textarea>


        <label>
            Technologies Used
        </label>

        <input
            type="text"
            id="projectTechnologies"
            placeholder="Example: HTML, CSS, JavaScript"
        >


        <label>
            Status
        </label>

        <select id="projectStatus">

            <option value="Planning">
                Planning
            </option>

            <option value="In Progress">
                In Progress
            </option>

            <option value="Completed">
                Completed
            </option>

        </select>


        <button onclick="addProject()">
            ➕ Add Project
        </button>

    </div>


    <!-- Projects List -->

    <div class="card">

        <h2>My Projects</h2>

        <div id="projectsList">

            <p>No projects added yet.</p>

        </div>

    </div>

</div>


<script>

    // Get saved projects
    let projects =
        JSON.parse(localStorage.getItem("projects")) || [];


    // Display projects
    function displayProjects() {

        const projectsList =
            document.getElementById("projectsList");


        // If there are no projects
        if (projects.length === 0) {

            projectsList.innerHTML =
                "<p>No projects added yet.</p>";

            return;
        }


        // Clear old projects
        projectsList.innerHTML = "";


        // Display every project
        projects.forEach(function(project, index) {

            const projectDiv =
                document.createElement("div");

            projectDiv.className = "project";


            projectDiv.innerHTML = `

                <h3>🚀 ${project.name}</h3>

                <p>
                    <strong>Description:</strong>
                    ${project.description}
                </p>

                <p>
                    <strong>Technologies:</strong>
                    ${project.technologies}
                </p>

                <p class="status">
                    Status: ${project.status}
                </p>

                <button
                    class="delete-button"
                    onclick="deleteProject(${index})">
                    🗑️ Delete Project
                </button>

            `;


            projectsList.appendChild(projectDiv);

        });

    }


    // Add a project
    function addProject() {

        const name =
            document.getElementById("projectName").value.trim();

        const description =
            document.getElementById("projectDescription").value.trim();

        const technologies =
            document.getElementById("projectTechnologies").value.trim();

        const status =
            document.getElementById("projectStatus").value;


        // Check if project name is empty
        if (name === "") {

            alert("Please enter a project name.");

            return;
        }


        // Create project
        const newProject = {

            name: name,

            description:
                description || "No description added.",

            technologies:
                technologies || "Not specified",

            status: status

        };


        // Add project to list
        projects.push(newProject);


        // Save projects
        localStorage.setItem(
            "projects",
            JSON.stringify(projects)
        );


        // Clear form
        document.getElementById("projectName").value = "";

        document.getElementById("projectDescription").value = "";

        document.getElementById("projectTechnologies").value = "";

        document.getElementById("projectStatus").value =
            "Planning";


        // Display projects
        displayProjects();

    }


    // Delete project
    function deleteProject(index) {

        const confirmDelete =
            confirm("Are you sure you want to delete this project?");


        if (confirmDelete) {

            projects.splice(index, 1);


            localStorage.setItem(
                "projects",
                JSON.stringify(projects)
            );


            displayProjects();

        }

    }


    // Display saved projects when page opens
    displayProjects();

</script>


</body>

</html>
