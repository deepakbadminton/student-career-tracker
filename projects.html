<!DOCTYPE html>
<html>

<head>
    <title>My Projects</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 18px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            display: block;
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 10px;
            background: #6b7280;
            color: white;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            background: #4b5563;
        }

        .project {
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            border-left: 5px solid #2563eb;
        }

        .project h3 {
            margin-top: 0;
            color: #1f2937;
        }

        .project p {
            color: #555;
            line-height: 1.5;
        }

        .status {
            font-weight: bold;
        }

        .delete-button {
            background: #ef4444;
            margin-top: 10px;
        }

        .delete-button:hover {
            background: #dc2626;
        }

    </style>

</head>

<body>

<div class="container">

    <a href="dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>

    <h1>🚀 My Projects</h1>

    <p class="subtitle">
        Build projects and showcase your skills to future employers.
    </p>


    <div class="card">

        <h2>➕ Add a Project</h2>

        <label>Project Name</label>

        <input
            type="text"
            id="projectName"
            placeholder="Example: Student Career Tracker"
        >

        <label>Description</label>

        <textarea
            id="projectDescription"
            placeholder="What does your project do?"
        ></textarea>

        <label>Technologies Used</label>

        <input
            type="text"
            id="technologies"
            placeholder="Example: HTML, CSS, JavaScript"
        >

        <label>Status</label>

        <select id="status">

            <option>Planning</option>
            <option>In Progress</option>
            <option>Completed</option>

        </select>

        <button onclick="addProject()">
            Add Project 🚀
        </button>

    </div>


    <div class="card">

        <h2>📂 My Projects</h2>

        <div id="projectList"></div>

    </div>

</div>


<script>

let projects =
    JSON.parse(localStorage.getItem("projects")) || [];


function displayProjects() {

    const projectList =
        document.getElementById("projectList");

    projectList.innerHTML = "";

    if (projects.length === 0) {

        projectList.innerHTML =
            "<p>No projects added yet.</p>";

        return;
    }

    projects.forEach((project, index) => {

        const projectDiv =
            document.createElement("div");

        projectDiv.className = "project";

        projectDiv.innerHTML = `

            <h3>${project.name}</h3>

            <p>${project.description}</p>

            <p>
                <strong>Technologies:</strong>
                ${project.technologies}
            </p>

            <p class="status">
                Status: ${project.status}
            </p>

            <button
                class="delete-button"
                onclick="deleteProject(${index})">
                Delete Project 🗑️
            </button>

        `;

        projectList.appendChild(projectDiv);

    });

}


function addProject() {

    const name =
        document.getElementById("projectName").value.trim();

    const description =
        document.getElementById("projectDescription").value.trim();

    const technologies =
        document.getElementById("technologies").value.trim();

    const status =
        document.getElementById("status").value;


    if (name === "" || description === "") {

        alert(
            "Please enter the project name and description."
        );

        return;
    }


    const newProject = {

        name: name,

        description: description,

        technologies:
            technologies || "Not specified",

        status: status

    };


    projects.push(newProject);


    localStorage.setItem(
        "projects",
        JSON.stringify(projects)
    );


    document.getElementById("projectName").value = "";

    document.getElementById("projectDescription").value = "";

    document.getElementById("technologies").value = "";

    document.getElementById("status").value = "Planning";


    displayProjects();

}


function deleteProject(index) {

    if (
        confirm(
            "Are you sure you want to delete this project?"
        )
    ) {

        projects.splice(index, 1);

        localStorage.setItem(
            "projects",
            JSON.stringify(projects)
        );

        displayProjects();

    }

}


displayProjects();

</script>

</body>

</html>
