<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Projects | Student Career Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button,
        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .back-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 180px;
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat h2 {
            margin: 5px 0;
            color: #2563eb;
        }

        .project {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .project h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            background: #eef2ff;
            font-weight: bold;
            font-size: 14px;
        }

        /* ==============================
           PROJECT PROGRESS
        ============================== */

        .progress-section {
            margin-top: 18px;
            padding: 15px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .progress-percentage {
            color: #2563eb;
            font-size: 18px;
        }

        .progress-container {
            background: #e5e7eb;
            height: 18px;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #2563eb;
            border-radius: 10px;
            transition: width 0.2s;
        }

        .progress-slider {
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            accent-color: #2563eb;
        }

        /* ==============================
           BUTTONS
        ============================== */

        .edit-button {
            background: #16a34a;
        }

        .edit-button:hover {
            background: #15803d;
        }

        .delete-button {
            background: #dc2626;
            margin-left: 8px;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .cancel-button {
            background: #6b7280;
            margin-left: 8px;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        .empty-message {
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>

<div class="container">


    <h1>🚀 My Projects</h1>


    <!-- BACK TO DASHBOARD -->

    <a href="dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>


    <!-- PROJECT STATISTICS -->

    <div class="card">

        <h2>📊 Project Summary</h2>

        <div class="stats">

            <div class="stat">

                <p>Total Projects</p>

                <h2 id="totalProjects">0</h2>

            </div>


            <div class="stat">

                <p>Completed</p>

                <h2 id="completedProjects">0</h2>

            </div>


            <div class="stat">

                <p>In Progress</p>

                <h2 id="activeProjects">0</h2>

            </div>

        </div>

    </div>


    <!-- ADD / EDIT PROJECT -->

    <div class="card">

        <h2 id="formTitle">
            ➕ Add New Project
        </h2>


        <form id="projectForm">


            <label for="projectName">
                Project Name
            </label>

            <input
                type="text"
                id="projectName"
                placeholder="Example: Student Career Tracker"
                required>


            <label for="projectDescription">
                Description
            </label>

            <textarea
                id="projectDescription"
                placeholder="What is your project about?"
                required></textarea>


            <label for="projectTech">
                Technologies Used
            </label>

            <input
                type="text"
                id="projectTech"
                placeholder="Example: HTML, CSS, JavaScript"
                required>


            <label for="projectStatus">
                Status
            </label>

            <select id="projectStatus">

                <option value="Planning">
                    Planning
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>


            <!-- PROJECT PROGRESS -->

            <label for="projectProgress">
                Project Progress
            </label>

            <input
                type="range"
                id="projectProgress"
                class="progress-slider"
                min="0"
                max="100"
                value="0">

            <p>
                Progress:
                <strong>
                    <span id="progressValue">0</span>%
                </strong>
            </p>


            <button
                type="submit"
                id="submitButton">

                Add Project 🚀

            </button>


            <button
                type="button"
                id="cancelButton"
                class="cancel-button"
                style="display: none;">

                Cancel Edit

            </button>

        </form>

    </div>


    <!-- PROJECT LIST -->

    <div class="card">

        <h2>📁 My Projects</h2>

        <div id="projectList">

            <p class="empty-message">
                No projects added yet.
            </p>

        </div>

    </div>


</div>


<script>


// ========================================
// LOAD PROJECTS
// ========================================

let projects =
    JSON.parse(
        localStorage.getItem("studentProjects")
    ) || [];


// ========================================
// EDITING STATE
// ========================================

let editingIndex = -1;


// ========================================
// ELEMENTS
// ========================================

const projectForm =
    document.getElementById("projectForm");

const projectList =
    document.getElementById("projectList");

const totalProjects =
    document.getElementById("totalProjects");

const completedProjects =
    document.getElementById("completedProjects");

const activeProjects =
    document.getElementById("activeProjects");

const formTitle =
    document.getElementById("formTitle");

const submitButton =
    document.getElementById("submitButton");

const cancelButton =
    document.getElementById("cancelButton");

const projectProgress =
    document.getElementById("projectProgress");

const progressValue =
    document.getElementById("progressValue");

const projectStatus =
    document.getElementById("projectStatus");


// ========================================
// ADD PROJECT FORM SLIDER
// ========================================

projectProgress.addEventListener(
    "input",
    function() {

        progressValue.textContent =
            projectProgress.value;

    }
);


// ========================================
// STATUS CHANGE IN FORM
// ========================================

projectStatus.addEventListener(
    "change",
    function() {

        if (
            projectStatus.value ===
            "Completed"
        ) {

            projectProgress.value = 100;

            progressValue.textContent = 100;

        }

    }
);


// ========================================
// SAVE PROJECTS
// ========================================

function saveProjects() {

    localStorage.setItem(
        "studentProjects",
        JSON.stringify(projects)
    );

}


// ========================================
// DISPLAY PROJECTS
// ========================================

function displayProjects() {

    projectList.innerHTML = "";


    if (projects.length === 0) {

        projectList.innerHTML =
            '<p class="empty-message">No projects added yet.</p>';

        updateStatistics();

        return;

    }


    projects.forEach(
        function(project, index) {


            /*
                Old projects may not have
                a progress value.
            */

            if (
                project.progress === undefined
            ) {

                project.progress = 0;

            }


            let progress =
                Number(project.progress);


            if (
                isNaN(progress)
            ) {

                progress = 0;

            }


            if (
                progress < 0
            ) {

                progress = 0;

            }


            if (
                progress > 100
            ) {

                progress = 100;

            }


            /*
                Completed projects are always 100%.
            */

            if (
                project.status ===
                "Completed"
            ) {

                progress = 100;

                project.progress = 100;

            }


            const projectDiv =
                document.createElement("div");

            projectDiv.className =
                "project";


            // ========================================
            // PROJECT NAME
            // ========================================

            const title =
                document.createElement("h3");

            title.textContent =
                "🚀 " + project.name;


            // ========================================
            // DESCRIPTION
            // ========================================

            const description =
                document.createElement("p");

            const descriptionLabel =
                document.createElement("strong");

            descriptionLabel.textContent =
                "Description: ";

            description.appendChild(
                descriptionLabel
            );

            description.appendChild(
                document.createTextNode(
                    project.description
                )
            );


            // ========================================
            // TECHNOLOGIES
            // ========================================

            const technology =
                document.createElement("p");

            const technologyLabel =
                document.createElement("strong");

            technologyLabel.textContent =
                "Technologies: ";

            technology.appendChild(
                technologyLabel
            );

            technology.appendChild(
                document.createTextNode(
                    project.technology
                )
            );


            // ========================================
            // STATUS
            // ========================================

            const statusText =
                document.createElement("p");

            const statusLabel =
                document.createElement("strong");

            statusLabel.textContent =
                "Status: ";

            const statusSpan =
                document.createElement("span");

            statusSpan.className =
                "status";

            statusSpan.textContent =
                project.status;

            statusText.appendChild(
                statusLabel
            );

            statusText.appendChild(
                statusSpan
            );


            // ========================================
            // PROGRESS SECTION
            // ========================================

            const progressSection =
                document.createElement("div");

            progressSection.className =
                "progress-section";


            const progressHeader =
                document.createElement("div");

            progressHeader.className =
                "progress-header";


            const progressTitle =
                document.createElement("span");

            progressTitle.textContent =
                "📊 Project Progress";


            const percentage =
                document.createElement("span");

            percentage.className =
                "progress-percentage";

            percentage.textContent =
                progress + "%";


            progressHeader.appendChild(
                progressTitle
            );

            progressHeader.appendChild(
                percentage
            );


            // ========================================
            // PROGRESS BAR
            // ========================================

            const progressContainer =
                document.createElement("div");

            progressContainer.className =
                "progress-container";


            const progressBar =
                document.createElement("div");

            progressBar.className =
                "progress-bar";

            progressBar.style.width =
                progress + "%";


            progressContainer.appendChild(
                progressBar
            );


            // ========================================
            // DIRECT PROJECT SLIDER
            // ========================================

            const slider =
                document.createElement("input");

            slider.type =
                "range";

            slider.min =
                0;

            slider.max =
                100;

            slider.value =
                progress;

            slider.className =
                "progress-slider";


            slider.addEventListener(
                "input",
                function() {

                    const newProgress =
                        Number(
                            slider.value
                        );


                    project.progress =
                        newProgress;


                    percentage.textContent =
                        newProgress + "%";


                    progressBar.style.width =
                        newProgress + "%";


                    /*
                        If slider reaches 100%,
                        automatically mark the
                        project as Completed.
                    */

                    if (
                        newProgress === 100
                    ) {

                        project.status =
                            "Completed";

                        statusSpan.textContent =
                            "Completed";

                    }


                    /*
                        If progress is below 100
                        and project was completed,
                        change it back to
                        In Progress.
                    */

                    else if (
                        project.status ===
                        "Completed"
                    ) {

                        project.status =
                            "In Progress";

                        statusSpan.textContent =
                            "In Progress";

                    }


                    saveProjects();

                    updateStatistics();

                }
            );


            progressSection.appendChild(
                progressHeader
            );

            progressSection.appendChild(
                progressContainer
            );

            progressSection.appendChild(
                slider
            );


            // ========================================
            // EDIT BUTTON
            // ========================================

            const editButton =
                document.createElement("button");

            editButton.className =
                "edit-button";

            editButton.textContent =
                "✏️ Edit";


            editButton.addEventListener(
                "click",
                function() {

                    editProject(index);

                }
            );


            // ========================================
            // DELETE BUTTON
            // ========================================

            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-button";

            deleteButton.textContent =
                "🗑️ Delete";


            deleteButton.addEventListener(
                "click",
                function() {

                    deleteProject(index);

                }
            );


            // ========================================
            // ADD EVERYTHING
            // ========================================

            projectDiv.appendChild(
                title
            );

            projectDiv.appendChild(
                description
            );

            projectDiv.appendChild(
                technology
            );

            projectDiv.appendChild(
                statusText
            );

            projectDiv.appendChild(
                progressSection
            );

            projectDiv.appendChild(
                editButton
            );

            projectDiv.appendChild(
                deleteButton
            );


            projectList.appendChild(
                projectDiv
            );

        }
    );


    saveProjects();

    updateStatistics();

}


// ========================================
// ADD / UPDATE PROJECT
// ========================================

projectForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById(
                "projectName"
            ).value.trim();


        const description =
            document.getElementById(
                "projectDescription"
            ).value.trim();


        const technology =
            document.getElementById(
                "projectTech"
            ).value.trim();


        const status =
            projectStatus.value;


        let progress =
            Number(
                projectProgress.value
            );


        if (
            status ===
            "Completed"
        ) {

            progress = 100;

        }


        const projectData = {

            name: name,

            description: description,

            technology: technology,

            status: status,

            progress: progress

        };


        // ========================================
        // UPDATE
        // ========================================

        if (
            editingIndex !== -1
        ) {

            projects[editingIndex] =
                projectData;

        }


        // ========================================
        // ADD
        // ========================================

        else {

            projects.push(
                projectData
            );

        }


        saveProjects();

        displayProjects();

        resetForm();

    }
);


// ========================================
// EDIT PROJECT
// ========================================

function editProject(index) {

    const project =
        projects[index];


    document.getElementById(
        "projectName"
    ).value =
        project.name;


    document.getElementById(
        "projectDescription"
    ).value =
        project.description;


    document.getElementById(
        "projectTech"
    ).value =
        project.technology;


    projectStatus.value =
        project.status;


    let progress =
        project.progress !== undefined
            ? Number(project.progress)
            : 0;


    if (
        project.status ===
        "Completed"
    ) {

        progress = 100;

    }


    projectProgress.value =
        progress;


    progressValue.textContent =
        progress;


    editingIndex =
        index;


    formTitle.textContent =
        "✏️ Edit Project";


    submitButton.textContent =
        "Update Project ✅";


    cancelButton.style.display =
        "inline-block";


    window.scrollTo({

        top: 0,

        behavior: "smooth"

    });

}


// ========================================
// CANCEL EDIT
// ========================================

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


// ========================================
// RESET FORM
// ========================================

function resetForm() {

    projectForm.reset();


    projectProgress.value =
        0;


    progressValue.textContent =
        0;


    editingIndex =
        -1;


    formTitle.textContent =
        "➕ Add New Project";


    submitButton.textContent =
        "Add Project 🚀";


    cancelButton.style.display =
        "none";

}


// ========================================
// DELETE PROJECT
// ========================================

function deleteProject(index) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this project?"
        );


    if (confirmDelete) {

        projects.splice(
            index,
            1
        );

        saveProjects();

        displayProjects();

    }

}


// ========================================
// PROJECT STATISTICS
// ========================================

function updateStatistics() {

    totalProjects.textContent =
        projects.length;


    let completed = 0;

    let active = 0;


    projects.forEach(
        function(project) {

            if (
                project.status ===
                "Completed"
            ) {

                completed++;

            }

            else if (
                project.status ===
                "In Progress"
            ) {

                active++;

            }

        }
    );


    completedProjects.textContent =
        completed;


    activeProjects.textContent =
        active;

}


// ========================================
// INITIAL DISPLAY
// ========================================

displayProjects();

</script>

</body>

</html>
