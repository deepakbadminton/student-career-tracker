<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Projects | Student Career Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            color: #2563eb;
        }

        .card {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button,
        .back-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
        }

        button:hover,
        .back-button:hover {
            background: #1d4ed8;
        }

        .stats {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stat {
            flex: 1;
            min-width: 180px;
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat h2 {
            margin: 5px 0;
            color: #2563eb;
        }

        .project {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 18px;
            margin-top: 15px;
        }

        .project h3 {
            margin-top: 0;
            color: #2563eb;
        }

        .status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 6px;
            background: #eef2ff;
            font-weight: bold;
            font-size: 14px;
        }

        .edit-button {
            background: #16a34a;
        }

        .edit-button:hover {
            background: #15803d;
        }

        .delete-button {
            background: #dc2626;
            margin-left: 8px;
        }

        .delete-button:hover {
            background: #b91c1c;
        }

        .cancel-button {
            background: #6b7280;
            margin-left: 8px;
        }

        .cancel-button:hover {
            background: #4b5563;
        }

        .empty-message {
            color: #6b7280;
            text-align: center;
            padding: 20px;
        }

    </style>

</head>


<body>

<div class="container">


    <h1>🚀 My Projects</h1>


    <!-- BACK TO DASHBOARD -->

    <a href="dashboard.html" class="back-button">
        ← Back to Dashboard
    </a>


    <!-- PROJECT STATISTICS -->

    <div class="card">

        <h2>📊 Project Summary</h2>

        <div class="stats">

            <div class="stat">

                <p>Total Projects</p>

                <h2 id="totalProjects">0</h2>

            </div>


            <div class="stat">

                <p>Completed</p>

                <h2 id="completedProjects">0</h2>

            </div>


            <div class="stat">

                <p>In Progress</p>

                <h2 id="activeProjects">0</h2>

            </div>

        </div>

    </div>


    <!-- ADD / EDIT PROJECT -->

    <div class="card">

        <h2 id="formTitle">➕ Add New Project</h2>


        <form id="projectForm">


            <label for="projectName">
                Project Name
            </label>

            <input
                type="text"
                id="projectName"
                placeholder="Example: Student Career Tracker"
                required>


            <label for="projectDescription">
                Description
            </label>

            <textarea
                id="projectDescription"
                placeholder="What is your project about?"
                required></textarea>


            <label for="projectTech">
                Technologies Used
            </label>

            <input
                type="text"
                id="projectTech"
                placeholder="Example: HTML, CSS, JavaScript"
                required>


            <label for="projectStatus">
                Status
            </label>

            <select id="projectStatus">

                <option value="Planning">
                    Planning
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>


            <button
                type="submit"
                id="submitButton">

                Add Project 🚀

            </button>


            <button
                type="button"
                id="cancelButton"
                class="cancel-button"
                style="display: none;">

                Cancel Edit

            </button>


        </form>

    </div>


    <!-- PROJECT LIST -->

    <div class="card">

        <h2>📁 My Projects</h2>

        <div id="projectList">

            <p class="empty-message">
                No projects added yet.
            </p>

        </div>

    </div>


</div>


<script>


// ========================================
// LOAD PROJECTS
// ========================================

let projects =
    JSON.parse(
        localStorage.getItem("studentProjects")
    ) || [];


// ========================================
// EDITING STATE
// ========================================

let editingIndex = -1;


// ========================================
// ELEMENTS
// ========================================

const projectForm =
    document.getElementById("projectForm");

const projectList =
    document.getElementById("projectList");

const totalProjects =
    document.getElementById("totalProjects");

const completedProjects =
    document.getElementById("completedProjects");

const activeProjects =
    document.getElementById("activeProjects");

const formTitle =
    document.getElementById("formTitle");

const submitButton =
    document.getElementById("submitButton");

const cancelButton =
    document.getElementById("cancelButton");


// ========================================
// SAVE PROJECTS
// ========================================

function saveProjects() {

    localStorage.setItem(
        "studentProjects",
        JSON.stringify(projects)
    );

}


// ========================================
// DISPLAY PROJECTS
// ========================================

function displayProjects() {

    projectList.innerHTML = "";


    if (projects.length === 0) {

        projectList.innerHTML =
            '<p class="empty-message">No projects added yet.</p>';

    }


    projects.forEach(
        function(project, index) {


            const projectDiv =
                document.createElement("div");

            projectDiv.className =
                "project";


            projectDiv.innerHTML = `

                <h3>🚀 ${project.name}</h3>

                <p>
                    <strong>Description:</strong>
                    ${project.description}
                </p>

                <p>
                    <strong>Technologies:</strong>
                    ${project.technology}
                </p>

                <p>
                    <strong>Status:</strong>
                    <span class="status">
                        ${project.status}
                    </span>
                </p>

                <button
                    class="edit-button"
                    onclick="editProject(${index})">

                    ✏️ Edit

                </button>

                <button
                    class="delete-button"
                    onclick="deleteProject(${index})">

                    🗑️ Delete

                </button>

            `;


            projectList.appendChild(projectDiv);

        }
    );


    updateStatistics();

}


// ========================================
// ADD / UPDATE PROJECT
// ========================================

projectForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const name =
            document.getElementById("projectName")
            .value.trim();


        const description =
            document.getElementById("projectDescription")
            .value.trim();


        const technology =
            document.getElementById("projectTech")
            .value.trim();


        const status =
            document.getElementById("projectStatus")
            .value;


        const projectData = {

            name: name,

            description: description,

            technology: technology,

            status: status

        };


        // UPDATE EXISTING PROJECT

        if (editingIndex !== -1) {

            projects[editingIndex] =
                projectData;

        }


        // ADD NEW PROJECT

        else {

            projects.push(
                projectData
            );

        }


        saveProjects();

        displayProjects();

        resetForm();

    }
);


// ========================================
// EDIT PROJECT
// ========================================

function editProject(index) {

    const project =
        projects[index];


    document.getElementById(
        "projectName"
    ).value =
        project.name;


    document.getElementById(
        "projectDescription"
    ).value =
        project.description;


    document.getElementById(
        "projectTech"
    ).value =
        project.technology;


    document.getElementById(
        "projectStatus"
    ).value =
        project.status;


    editingIndex =
        index;


    formTitle.textContent =
        "✏️ Edit Project";


    submitButton.textContent =
        "Update Project ✅";


    cancelButton.style.display =
        "inline-block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// ========================================
// CANCEL EDIT
// ========================================

cancelButton.addEventListener(
    "click",
    function() {

        resetForm();

    }
);


// ========================================
// RESET FORM
// ========================================

function resetForm() {

    projectForm.reset();


    editingIndex =
        -1;


    formTitle.textContent =
        "➕ Add New Project";


    submitButton.textContent =
        "Add Project 🚀";


    cancelButton.style.display =
        "none";

}


// ========================================
// DELETE PROJECT
// ========================================

function deleteProject(index) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this project?"
        );


    if (confirmDelete) {

        projects.splice(index, 1);

        saveProjects();

        displayProjects();

    }

}


// ========================================
// PROJECT STATISTICS
// ========================================

function updateStatistics() {

    totalProjects.textContent =
        projects.length;


    let completed = 0;

    let active = 0;


    projects.forEach(
        function(project) {

            if (
                project.status ===
                "Completed"
            ) {

                completed++;

            }

            else if (
                project.status ===
                "In Progress"
            ) {

                active++;

            }

        }
    );


    completedProjects.textContent =
        completed;


    activeProjects.textContent =
        active;

}


// ========================================
// INITIAL DISPLAY
// ========================================

displayProjects();


</script>


</body>

</html>
