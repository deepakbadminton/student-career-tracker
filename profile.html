<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Your Profile | Student Career Tracker</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef2ff,
                    #f8fafc
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px;

        }


        .container {

            width: 100%;

            max-width: 520px;

            background: white;

            padding: 40px;

            border-radius: 24px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.08);

        }


        .logo {

            text-align: center;

            font-size: 42px;

            margin-bottom: 10px;

        }


        h1 {

            text-align: center;

            font-size: 30px;

            color: #111827;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;

            line-height: 1.5;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            font-size: 14px;

            font-weight: bold;

            color: #374151;

            margin-bottom: 8px;

        }


        input,
        select {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            font-size: 15px;

            outline: none;

            background: white;

        }


        input:focus,
        select:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px
                rgba(99, 102, 241, 0.12);

        }


        .hint {

            font-size: 12px;

            color: #9ca3af;

            margin-top: 6px;

        }


        button {

            width: 100%;

            padding: 15px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #4f46e5;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #4338ca;

        }


        .footer {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #9ca3af;

        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        🚀
    </div>


    <h1>
        Create Your Profile
    </h1>


    <p class="subtitle">

        Tell us about yourself and we'll help
        you build your career roadmap.

    </p>


    <form onsubmit="goToDashboard(event)">


        <!-- NAME -->

        <div class="form-group">

            <label>
                Your Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

        </div>


        <!-- BRANCH -->

        <div class="form-group">

            <label>
                Branch
            </label>

            <select
                id="branch"
                required>

                <option value="">
                    Choose your branch
                </option>

                <option>
                    CSE
                </option>

                <option>
                    AIML
                </option>

                <option>
                    ISE
                </option>

                <option>
                    ECE
                </option>

                <option>
                    Other
                </option>

            </select>

        </div>


        <!-- YEAR -->

        <div class="form-group">

            <label>
                Year of Study
            </label>

            <select
                id="year"
                required>

                <option value="">
                    Choose your year
                </option>

                <option>
                    1st Year
                </option>

                <option>
                    2nd Year
                </option>

                <option>
                    3rd Year
                </option>

                <option>
                    4th Year
                </option>

            </select>

        </div>


        <!-- SKILLS -->

        <div class="form-group">

            <label>
                Skills You Know
            </label>

            <input
                type="text"
                id="skills"
                placeholder="Example: Python, C, Java"
            >

            <p class="hint">

                You can add more skills later.

            </p>

        </div>


        <!-- CAREER PATH -->

        <div class="form-group">

            <label>
                Career Path
            </label>

            <select
                id="careerPath"
                required>

                <option value="">
                    Choose your career path
                </option>

                <option value="Software Developer">
                    💻 Software Developer
                </option>

                <option value="AI / ML">
                    🤖 AI / ML
                </option>

                <option value="Web Developer">
                    🌐 Web Developer
                </option>

                <option value="Data Analyst">
                    📊 Data Analyst
                </option>

                <option value="Cybersecurity">
                    🔐 Cybersecurity
                </option>

            </select>

        </div>


        <!-- SUBMIT -->

        <button type="submit">

            Continue to Dashboard →

        </button>


    </form>


    <p class="footer">

        Your career journey starts here.

    </p>


</div>


<script>


function goToDashboard(event) {

    event.preventDefault();


    // Get profile information

    const name =
        document.getElementById("name").value;

    const branch =
        document.getElementById("branch").value;

    const year =
        document.getElementById("year").value;

    const skills =
        document.getElementById("skills").value;

    const careerPath =
        document.getElementById("careerPath").value;


    // Save profile information

    localStorage.setItem(
        "name",
        name
    );


    localStorage.setItem(
        "branch",
        branch
    );


    localStorage.setItem(
        "year",
        year
    );


    localStorage.setItem(
        "skills",
        skills
    );


    localStorage.setItem(
        "careerPath",
        careerPath
    );


    // Go to dashboard

    window.location.href =
        "dashboard.html";

}

</script>


</body>

</html>
