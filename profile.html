<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Profile | Student Career Tracker</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 20px;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2563eb;
            text-align: center;
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .back-button {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
            text-decoration: none;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <h1>🎓 Student Career Tracker</h1>

        <h2>👤 Your Profile</h2>

        <p>
            Enter your details to personalize your career dashboard.
        </p>


        <form id="profileForm">


            <!-- NAME -->

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required>


            <!-- BRANCH -->

            <label for="branch">
                Branch
            </label>

            <select id="branch" required>

                <option value="">
                    Select your branch
                </option>

                <option value="CSE">
                    CSE
                </option>

                <option value="AIML">
                    AIML
                </option>

                <option value="ISE">
                    ISE
                </option>

                <option value="ECE">
                    ECE
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- YEAR -->

            <label for="year">
                Year
            </label>

            <select id="year" required>

                <option value="">
                    Select your year
                </option>

                <option value="1st Year">
                    1st Year
                </option>

                <option value="2nd Year">
                    2nd Year
                </option>

                <option value="3rd Year">
                    3rd Year
                </option>

                <option value="4th Year">
                    4th Year
                </option>

            </select>


            <!-- SKILLS -->

            <label for="skills">
                Skills
            </label>

            <input
                type="text"
                id="skills"
                placeholder="Example: Python, C, Java">


            <!-- CAREER PATH -->

            <label for="careerPath">
                🎯 Career Path
            </label>

            <select id="careerPath" required>

                <option value="">
                    Select your career path
                </option>

                <option value="Software Developer">
                    Software Developer
                </option>

                <option value="AI / ML">
                    AI / ML
                </option>

                <option value="Web Developer">
                    Web Developer
                </option>

                <option value="Data Analyst">
                    Data Analyst
                </option>

                <option value="Cybersecurity">
                    Cybersecurity
                </option>

            </select>


            <!-- SAVE -->

            <button type="submit">

                Save Profile & Continue 🚀

            </button>


        </form>


        <p
            id="message"
            class="message">
        </p>


        <a
            href="dashboard.html"
            class="back-button">

            ← Back to Dashboard

        </a>

    </div>

</div>


<script>


// ========================================
// LOAD EXISTING PROFILE
// ========================================

const savedName =
    localStorage.getItem("name");

const savedBranch =
    localStorage.getItem("branch");

const savedYear =
    localStorage.getItem("year");

const savedSkills =
    localStorage.getItem("skills");

const savedCareerPath =
    localStorage.getItem("careerPath");


// Put saved information into the form

if (savedName) {

    document.getElementById("name").value =
        savedName;

}

if (savedBranch) {

    document.getElementById("branch").value =
        savedBranch;

}

if (savedYear) {

    document.getElementById("year").value =
        savedYear;

}

if (savedSkills) {

    document.getElementById("skills").value =
        savedSkills;

}

if (savedCareerPath) {

    document.getElementById("careerPath").value =
        savedCareerPath;

}


// ========================================
// SAVE PROFILE
// ========================================

const profileForm =
    document.getElementById("profileForm");


profileForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        // Get values

        const name =
            document.getElementById("name")
            .value.trim();


        const branch =
            document.getElementById("branch")
            .value;


        const year =
            document.getElementById("year")
            .value;


        const skills =
            document.getElementById("skills")
            .value.trim();


        const careerPath =
            document.getElementById("careerPath")
            .value;


        // Save values

        localStorage.setItem(
            "name",
            name
        );


        localStorage.setItem(
            "branch",
            branch
        );


        localStorage.setItem(
            "year",
            year
        );


        localStorage.setItem(
            "skills",
            skills
        );


        localStorage.setItem(
            "careerPath",
            careerPath
        );


        // Show message

        const message =
            document.getElementById("message");


        message.textContent =
            "Profile saved successfully! 🚀";


        // Go to dashboard

        setTimeout(
            function() {

                window.location.href =
                    "dashboard.html";

            },
            700
        );

    }
);


</script>


</body>

</html>
